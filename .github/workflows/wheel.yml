name: Build

on: [push, pull_request]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["macos-11", ubuntu-20.04]

    steps:
      - uses: actions/checkout@v2
        with:
          submodules: 'recursive'

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.2.2
        env:
          CIBW_ENVIRONMENT_LINUX: DOTNET_ROOT=/root/.dotnet LD_LIBRARY_PATH=/root/.dotnet/shared/Microsoft.NETCore.App/6.0.0

      - uses: actions/upload-artifact@v2
        with:
          path: ./wheelhouse/*.whl
